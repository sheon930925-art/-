<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>長輩溝通大字板</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Noto Sans TC & Inter for crisp Traditional Chinese legibility -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       Theme Variables & High-Contrast Accessibility Tokens
       ========================================================================== */
    :root {
      --bg-board: #000000;
      --text-board: #FFEB3B;
      --text-muted: rgba(255, 235, 59, 0.55);
      --ui-surface: #121212;
      --ui-elevated: #1E1E1E;
      --ui-border: rgba(255, 235, 59, 0.35);
      --accent-bg: #FFEB3B;
      --accent-text: #000000;
      --danger-bg: #EF4444;
      --danger-text: #FFFFFF;
    }

    [data-theme="black-white"] {
      --bg-board: #000000;
      --text-board: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.55);
      --ui-surface: #121212;
      --ui-elevated: #222222;
      --ui-border: rgba(255, 255, 255, 0.35);
      --accent-bg: #FFFFFF;
      --accent-text: #000000;
    }

    [data-theme="white-black"] {
      --bg-board: #FFFFFF;
      --text-board: #000000;
      --text-muted: rgba(0, 0, 0, 0.45);
      --ui-surface: #F3F4F6;
      --ui-elevated: #E5E7EB;
      --ui-border: rgba(0, 0, 0, 0.25);
      --accent-bg: #111827;
      --accent-text: #FFFFFF;
    }

    /* Prevent mobile Chrome pull-to-refresh & ensure dynamic viewport height */
    html,
    body {
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: 'Noto Sans TC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-board);
      color: var(--text-board);
      -webkit-tap-highlight-color: transparent;
    }

    /* Dynamic theme utility bindings */
    .board-bg {
      background-color: var(--bg-board);
      color: var(--text-board);
    }

    .ui-surface {
      background-color: var(--ui-surface);
      border-color: var(--ui-border);
    }

    .ui-elevated {
      background-color: var(--ui-elevated);
      border-color: var(--ui-border);
      color: var(--text-board);
    }

    .ui-accent {
      background-color: var(--accent-bg);
      color: var(--accent-text);
    }

    .ui-border {
      border-color: var(--ui-border);
    }

    .text-board-muted {
      color: var(--text-muted);
    }

    /* Custom range slider for accessible touch dragging */
    input[type="range"].accessible-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 10px;
      border-radius: 999px;
      background: var(--ui-elevated);
      border: 1px solid var(--ui-border);
      outline: none;
    }

    input[type="range"].accessible-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-bg);
      border: 3px solid var(--bg-board);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    input[type="range"].accessible-slider::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-bg);
      border: 3px solid var(--bg-board);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    /* Prevent browser scrolling while drawing on canvas */
    #drawingCanvas {
      touch-action: none;
      cursor: crosshair;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Subtle pulse animation for active voice recording */
    @keyframes pulseRing {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      }
      70% {
        box-shadow: 0 0 0 12px rgba(239, 68, 68, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }

    .recording-pulse {
      animation: pulseRing 1.5s infinite;
    }

    /* Clean scrollbar for long big-text messages and phrase list */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: var(--ui-border);
      border-radius: 999px;
    }
  </style>
</head>
<body data-theme="black-yellow" class="flex flex-col select-none">

  <!-- ========================================================================
       1. TOP HEADER & MODE SWITCHER
       ======================================================================== -->
  <header class="ui-surface border-b px-3 pt-2 pb-2 shrink-0 z-20">
    <div class="max-w-3xl mx-auto flex flex-col gap-2">
      <!-- Title & High-Contrast Theme Pills -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center justify-center w-8 h-8 rounded-xl ui-accent font-black text-base shadow-sm" aria-hidden="true">大</span>
          <h1 class="text-base sm:text-lg font-black tracking-tight">長輩溝通大字板</h1>
        </div>

        <!-- High-Contrast Theme Switcher -->
        <div class="flex items-center gap-1.5" role="group" aria-label="高對比配色切換">
          <button
            type="button"
            data-theme-btn="black-yellow"
            onclick="setTheme('black-yellow')"
            class="theme-btn min-h-[38px] px-2.5 rounded-xl text-xs sm:text-sm font-extrabold border-2 transition-transform active:scale-95 bg-black text-[#FFEB3B] border-[#FFEB3B]"
            title="黑底亮黃字（適合白內障與視力退化長輩）"
          >
            黑底黃字
          </button>
          <button
            type="button"
            data-theme-btn="black-white"
            onclick="setTheme('black-white')"
            class="theme-btn min-h-[38px] px-2.5 rounded-xl text-xs sm:text-sm font-extrabold border transition-transform active:scale-95 bg-black text-white border-white/40"
            title="黑底白字"
          >
            黑底白字
          </button>
          <button
            type="button"
            data-theme-btn="white-black"
            onclick="setTheme('white-black')"
            class="theme-btn min-h-[38px] px-2.5 rounded-xl text-xs sm:text-sm font-extrabold border transition-transform active:scale-95 bg-white text-black border-black/40"
            title="白底黑字"
          >
            白底黑字
          </button>
        </div>
      </div>

      <!-- Mode Switcher Tabs (Big Text / Handwriting Canvas / Quick Phrases) -->
      <nav class="grid grid-cols-3 gap-1.5" aria-label="功能模式切換">
        <button
          type="button"
          id="tab-text"
          onclick="switchMode('text')"
          class="mode-tab min-h-[48px] rounded-xl font-black text-sm sm:text-base flex items-center justify-center gap-1.5 border transition-all active:scale-95 ui-accent"
        >
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M12 6v14M7 20h10" />
          </svg>
          <span>大字打字</span>
        </button>

        <button
          type="button"
          id="tab-draw"
          onclick="switchMode('draw')"
          class="mode-tab min-h-[48px] rounded-xl font-black text-sm sm:text-base flex items-center justify-center gap-1.5 border transition-all active:scale-95 ui-elevated"
        >
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" />
          </svg>
          <span>手寫畫板</span>
        </button>

        <button
          type="button"
          id="tab-phrases"
          onclick="switchMode('phrases')"
          class="mode-tab min-h-[48px] rounded-xl font-black text-sm sm:text-base flex items-center justify-center gap-1.5 border transition-all active:scale-95 ui-elevated"
        >
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" />
          </svg>
          <span>常用語句</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- ========================================================================
       2. FONT SIZE ACCESSIBILITY TOOLBAR (Visible in Big Text Mode)
       ======================================================================== -->
  <section id="fontToolbar" class="ui-surface border-b px-3 py-1.5 shrink-0 z-10" aria-label="字體大小調整">
    <div class="max-w-3xl mx-auto flex items-center gap-2">
      <button
        type="button"
        onclick="adjustFontSize(-8)"
        class="min-h-[48px] min-w-[52px] rounded-xl ui-elevated border font-black text-lg flex items-center justify-center active:scale-95 transition-transform"
        aria-label="縮小字體"
      >
        A-
      </button>

      <div class="flex-1 flex flex-col justify-center px-1">
        <div class="flex justify-between items-center text-xs font-bold mb-1 opacity-90">
          <span>字體大小</span>
          <span id="fontSizeLabel" class="font-black">68px</span>
        </div>
        <input
          id="fontSizeSlider"
          type="range"
          min="36"
          max="120"
          step="2"
          value="68"
          oninput="setFontSize(this.value)"
          class="accessible-slider w-full"
          aria-label="調整字體大小滑桿"
        />
      </div>

      <button
        type="button"
        onclick="adjustFontSize(8)"
        class="min-h-[48px] min-w-[52px] rounded-xl ui-elevated border font-black text-xl flex items-center justify-center active:scale-95 transition-transform"
        aria-label="放大字體"
      >
        A+
      </button>
    </div>
  </section>

  <!-- ========================================================================
       3. MAIN CONTENT AREA (Dynamic Views)
       ======================================================================== -->
  <main class="flex-1 relative overflow-hidden flex flex-col w-full">

    <!-- ----------------------------------------------------------------------
         VIEW A: BIG TEXT MODE (大字打字模式)
         ---------------------------------------------------------------------- -->
    <div id="view-text" class="flex-1 flex flex-col overflow-hidden">
      <!-- Massive Text Display Board -->
      <div
        id="bigTextContainer"
        onclick="focusTextInput()"
        class="flex-1 overflow-y-auto custom-scroll px-5 py-6 flex items-center justify-center text-center board-bg cursor-text"
      >
        <div
          id="bigTextDisplay"
          style="font-size: 68px;"
          class="w-full max-w-4xl font-black leading-snug tracking-wide break-words whitespace-pre-wrap select-text"
        ></div>
        <div
          id="bigTextPlaceholder"
          class="text-board-muted text-2xl sm:text-3xl font-bold leading-relaxed pointer-events-none px-4"
        >
          請在下方輸入文字，<br />或點擊「語音輸入」說話給長輩看
        </div>
      </div>

      <!-- Bottom Input & Primary Actions -->
      <div class="ui-surface border-t px-3 py-2.5 shrink-0">
        <div class="max-w-3xl mx-auto flex flex-col gap-2">
          <!-- Input Row -->
          <div class="flex items-stretch gap-2">
            <textarea
              id="messageInput"
              rows="2"
              placeholder="輸入要給長輩看的內容..."
              oninput="handleTextInput(this.value)"
              class="flex-1 rounded-2xl ui-elevated border-2 px-3.5 py-2.5 text-lg font-bold leading-snug resize-none focus:outline-none focus:ring-2 focus:ring-current"
            ></textarea>

            <!-- Clear Text Button -->
            <button
              type="button"
              onclick="clearText()"
              class="min-h-[48px] min-w-[74px] px-3 rounded-2xl bg-red-600 hover:bg-red-700 text-white font-black text-base flex flex-col items-center justify-center gap-0.5 shadow-sm active:scale-95 transition-transform shrink-0"
              aria-label="清除文字"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
              </svg>
              <span>清除</span>
            </button>
          </div>

          <!-- Action Buttons Row: Voice Input + Full-Screen Display -->
          <div class="grid grid-cols-2 gap-2">
            <button
              type="button"
              id="voiceBtn"
              onclick="toggleVoiceInput()"
              class="min-h-[52px] px-4 rounded-2xl ui-elevated border-2 font-black text-base sm:text-lg flex items-center justify-center gap-2 active:scale-95 transition-all"
            >
              <svg id="micIcon" class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
              </svg>
              <span id="voiceBtnText">語音輸入</span>
            </button>

            <button
              type="button"
              onclick="enterFullScreen()"
              class="min-h-[52px] px-4 rounded-2xl ui-accent font-black text-base sm:text-lg flex items-center justify-center gap-2 shadow-md active:scale-95 transition-transform"
            >
              <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
              </svg>
              <span>全螢幕展示</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ----------------------------------------------------------------------
         VIEW B: HANDWRITING CANVAS MODE (手寫畫板模式)
         ---------------------------------------------------------------------- -->
    <div id="view-draw" class="hidden flex-1 flex flex-col overflow-hidden">
      <!-- Canvas Container -->
      <div id="canvasWrapper" class="flex-1 relative w-full overflow-hidden board-bg">
        <canvas id="drawingCanvas"></canvas>

        <!-- Helpful watermark hint when canvas is empty -->
        <div
          id="canvasHint"
          class="absolute inset-0 flex items-center justify-center pointer-events-none text-center px-6"
        >
          <p class="text-board-muted text-2xl sm:text-3xl font-bold">
            請用手指直接在螢幕上寫字或畫圖
          </p>
        </div>
      </div>

      <!-- Drawing Controls Bar -->
      <div class="ui-surface border-t px-3 py-2.5 shrink-0">
        <div class="max-w-3xl mx-auto flex flex-wrap items-center justify-between gap-2">
          <!-- Brush Thickness Selector -->
          <div class="flex items-center gap-2" role="group" aria-label="筆畫粗細">
            <button
              type="button"
              id="brush-thick"
              onclick="setBrushSize(8)"
              class="min-h-[48px] px-3.5 rounded-2xl border-2 font-black text-base flex items-center gap-2 active:scale-95 transition-transform ui-accent"
            >
              <span class="inline-block w-3 h-3 rounded-full bg-current"></span>
              <span>粗筆</span>
            </button>

            <button
              type="button"
              id="brush-extra"
              onclick="setBrushSize(16)"
              class="min-h-[48px] px-3.5 rounded-2xl border-2 font-black text-base flex items-center gap-2 active:scale-95 transition-transform ui-elevated"
            >
              <span class="inline-block w-5 h-5 rounded-full bg-current"></span>
              <span>特粗</span>
            </button>
          </div>

          <!-- Undo & Clear Canvas Buttons -->
          <div class="flex items-center gap-2">
            <button
              type="button"
              onclick="undoStroke()"
              class="min-h-[48px] px-4 rounded-2xl ui-elevated border-2 font-black text-base flex items-center gap-1.5 active:scale-95 transition-transform"
              aria-label="復原上一筆"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" />
              </svg>
              <span>復原</span>
            </button>

            <button
              type="button"
              onclick="clearCanvas()"
              class="min-h-[48px] px-4 rounded-2xl bg-red-600 hover:bg-red-700 text-white font-black text-base flex items-center gap-1.5 shadow-sm active:scale-95 transition-transform"
              aria-label="全部清除畫板"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
              </svg>
              <span>全部清除</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ----------------------------------------------------------------------
         VIEW C: QUICK PHRASES LIBRARY (常用語句庫)
         ---------------------------------------------------------------------- -->
    <div id="view-phrases" class="hidden flex-1 flex flex-col overflow-hidden board-bg">
      <!-- Add Custom Phrase Input Bar -->
      <div class="ui-surface border-b px-3 py-3 shrink-0">
        <form onsubmit="addCustomPhrase(event)" class="max-w-3xl mx-auto flex gap-2">
          <input
            id="newPhraseInput"
            type="text"
            maxlength="60"
            placeholder="輸入新增自訂語句（例如：等一下量血壓）"
            class="flex-1 min-h-[48px] rounded-2xl ui-elevated border-2 px-3.5 text-base font-bold focus:outline-none focus:ring-2 focus:ring-current"
          />
          <button
            type="submit"
            class="min-h-[48px] px-5 rounded-2xl ui-accent font-black text-base shrink-0 active:scale-95 transition-transform"
          >
            + 新增
          </button>
        </form>
      </div>

      <!-- Phrase Cards List -->
      <div class="flex-1 overflow-y-auto custom-scroll px-3 py-3">
        <div class="max-w-3xl mx-auto flex flex-col gap-2.5 pb-6">
          <p class="text-sm font-bold opacity-80 px-1">點擊下方任一句子，立即放大顯示給長輩看：</p>
          <div id="phraseListContainer" class="flex flex-col gap-2.5">
            <!-- Dynamically populated phrase buttons -->
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- ========================================================================
       4. FULL-SCREEN DISPLAY OVERLAY (全螢幕展示模式)
       ======================================================================== -->
  <div
    id="fullScreenOverlay"
    onclick="exitFullScreen()"
    class="hidden fixed inset-0 z-50 board-bg flex flex-col justify-between p-6 cursor-pointer select-none"
    role="dialog"
    aria-modal="true"
    aria-label="全螢幕大字展示"
  >
    <!-- Top subtle instruction bar -->
    <div class="flex justify-center pt-1">
      <span class="px-4 py-1.5 rounded-full ui-elevated border text-sm font-bold opacity-75">
        輕觸螢幕任意處即可返回
      </span>
    </div>

    <!-- Centered Giant Text -->
    <div class="flex-1 flex items-center justify-center overflow-y-auto my-4">
      <div
        id="fullScreenText"
        class="w-full max-w-5xl text-center font-black leading-snug tracking-wide break-words whitespace-pre-wrap"
      ></div>
    </div>

    <!-- Bottom spacer for visual balance -->
    <div class="h-6"></div>
  </div>

  <!-- ========================================================================
       5. TOAST NOTIFICATION BANNER (Non-blocking Feedback)
       ======================================================================== -->
  <div
    id="toastContainer"
    class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 -translate-y-2 w-[92%] max-w-md"
    aria-live="polite"
  >
    <div id="toastBox" class="ui-accent px-4 py-3 rounded-2xl shadow-2xl border-2 border-black/20 text-center font-black text-base">
      提示訊息
    </div>
  </div>

  <!-- ========================================================================
       APPLICATION LOGIC (JavaScript)
       ======================================================================== -->
  <script>
    /**
     * Storage Keys & Default Configuration
     */
    const STORAGE_KEYS = {
      THEME: 'senior_board_theme_v1',
      FONT_SIZE: 'senior_board_fontsize_v1',
      CUSTOM_PHRASES: 'senior_board_custom_phrases_v1',
      LAST_TEXT: 'senior_board_last_text_v1'
    };

    const DEFAULT_PHRASES = [
      '您好！我是來關心您的',
      '請問現在哪裡不舒服？',
      '記得按時吃藥喔',
      '先喝口水休息一下',
      '慢慢說，我看得懂',
      '沒問題，交給我處理',
      '需要幫忙請跟我說',
      '請問今天吃飽了嗎？',
      '等一下我們一起量血壓'
    ];

    /**
     * Application State
     */
    const state = {
      mode: 'text',           // 'text' | 'draw' | 'phrases'
      theme: 'black-yellow',  // 'black-yellow' | 'black-white' | 'white-black'
      fontSize: 68,           // 36px - 120px
      text: '',
      customPhrases: [],
      brushSize: 8,           // 8 (粗筆) | 16 (特粗)
      strokes: [],            // Array of { points: [{x, y}], size: number }
      isDrawing: false,
      currentStroke: null,
      isListening: false,
      recognition: null
    };

    let toastTimeout = null;

    /**
     * Initialize Application on Window Load
     */
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedSettings();
      initCanvas();
      initSpeechRecognition();
      renderPhrases();
      updateTextDisplay(state.text);
    });

    /**
     * Load persisted theme, font size, custom phrases, and draft text from localStorage
     */
    function loadSavedSettings() {
      try {
        const savedTheme = localStorage.getItem(STORAGE_KEYS.THEME);
        if (savedTheme && ['black-yellow', 'black-white', 'white-black'].includes(savedTheme)) {
          state.theme = savedTheme;
        }
        setTheme(state.theme, false);

        const savedFontSize = parseInt(localStorage.getItem(STORAGE_KEYS.FONT_SIZE), 10);
        if (!isNaN(savedFontSize) && savedFontSize >= 36 && savedFontSize <= 120) {
          state.fontSize = savedFontSize;
        }
        setFontSize(state.fontSize, false);

        const savedPhrases = localStorage.getItem(STORAGE_KEYS.CUSTOM_PHRASES);
        if (savedPhrases) {
          const parsed = JSON.parse(savedPhrases);
          if (Array.isArray(parsed)) {
            state.customPhrases = parsed;
          }
        }

        const savedText = localStorage.getItem(STORAGE_KEYS.LAST_TEXT);
        if (savedText) {
          state.text = savedText;
          document.getElementById('messageInput').value = savedText;
        }
      } catch (err) {
        console.warn('讀取本機設定時發生錯誤:', err);
      }
    }

    /**
     * Show non-blocking Toast Message (Replaces native alert)
     */
    function showToast(message, duration = 2600) {
      const container = document.getElementById('toastContainer');
      const box = document.getElementById('toastBox');
      box.textContent = message;

      container.classList.remove('opacity-0', '-translate-y-2');
      container.classList.add('opacity-100', 'translate-y-0');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        container.classList.remove('opacity-100', 'translate-y-0');
        container.classList.add('opacity-0', '-translate-y-2');
      }, duration);
    }

    /**
     * Trigger gentle haptic vibration on supported mobile Chrome devices
     */
    function triggerHaptic(ms = 18) {
      if (navigator.vibrate) {
        try {
          navigator.vibrate(ms);
        } catch (e) {
          // Ignore on unsupported devices
        }
      }
    }

    /**
     * Switch High-Contrast Theme
     */
    function setTheme(themeName, save = true) {
      state.theme = themeName;
      document.body.setAttribute('data-theme', themeName);

      // Update theme meta color for mobile Chrome address bar
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        metaTheme.setAttribute('content', themeName === 'white-black' ? '#FFFFFF' : '#000000');
      }

      // Highlight active theme button border
      document.querySelectorAll('.theme-btn').forEach((btn) => {
        const isSelected = btn.getAttribute('data-theme-btn') === themeName;
        if (isSelected) {
          btn.classList.add('ring-2', 'ring-offset-2', 'ring-offset-black', 'scale-105');
        } else {
          btn.classList.remove('ring-2', 'ring-offset-2', 'ring-offset-black', 'scale-105');
        }
      });

      if (save) {
        try {
          localStorage.setItem(STORAGE_KEYS.THEME, themeName);
        } catch (e) {}
        triggerHaptic();
      }

      // Re-render handwriting canvas so background & stroke colors match the new high-contrast theme
      redrawCanvas();
    }

    /**
     * Switch Top Navigation Mode ('text' | 'draw' | 'phrases')
     */
    function switchMode(newMode) {
      state.mode = newMode;
      triggerHaptic();

      // Update tab button active states
      const tabs = {
        text: document.getElementById('tab-text'),
        draw: document.getElementById('tab-draw'),
        phrases: document.getElementById('tab-phrases')
      };

      Object.entries(tabs).forEach(([key, el]) => {
        if (key === newMode) {
          el.classList.remove('ui-elevated');
          el.classList.add('ui-accent');
        } else {
          el.classList.remove('ui-accent');
          el.classList.add('ui-elevated');
        }
      });

      // Toggle views
      document.getElementById('view-text').classList.toggle('hidden', newMode !== 'text');
      document.getElementById('view-draw').classList.toggle('hidden', newMode !== 'draw');
      document.getElementById('view-phrases').classList.toggle('hidden', newMode !== 'phrases');

      // Show font toolbar only in Big Text mode to maximize canvas & phrase list space
      document.getElementById('fontToolbar').classList.toggle('hidden', newMode !== 'text');

      if (newMode === 'draw') {
        // Resize canvas after becoming visible so dimensions are accurate
        requestAnimationFrame(() => {
          resizeCanvas();
        });
      }
    }

    /* ==========================================================================
       BIG TEXT MODE & FONT CONTROLS
       ========================================================================== */

    function setFontSize(size, save = true) {
      const clamped = Math.max(36, Math.min(120, parseInt(size, 10) || 68));
      state.fontSize = clamped;

      const slider = document.getElementById('fontSizeSlider');
      const label = document.getElementById('fontSizeLabel');
      const display = document.getElementById('bigTextDisplay');

      if (slider) slider.value = clamped;
      if (label) label.textContent = `${clamped}px`;
      if (display) display.style.fontSize = `${clamped}px`;

      if (save) {
        try {
          localStorage.setItem(STORAGE_KEYS.FONT_SIZE, String(clamped));
        } catch (e) {}
      }
    }

    function adjustFontSize(delta) {
      setFontSize(state.fontSize + delta, true);
      triggerHaptic();
    }

    function handleTextInput(value) {
      state.text = value;
      updateTextDisplay(value);
      try {
        localStorage.setItem(STORAGE_KEYS.LAST_TEXT, value);
      } catch (e) {}
    }

    function updateTextDisplay(value) {
      const display = document.getElementById('bigTextDisplay');
      const placeholder = document.getElementById('bigTextPlaceholder');

      if (!value || value.trim() === '') {
        display.textContent = '';
        display.classList.add('hidden');
        placeholder.classList.remove('hidden');
      } else {
        display.textContent = value;
        display.classList.remove('hidden');
        placeholder.classList.add('hidden');
      }
    }

    function focusTextInput() {
      const input = document.getElementById('messageInput');
      if (input) input.focus();
    }

    function clearText() {
      state.text = '';
      const input = document.getElementById('messageInput');
      input.value = '';
      updateTextDisplay('');
      try {
        localStorage.removeItem(STORAGE_KEYS.LAST_TEXT);
      } catch (e) {}
      triggerHaptic(25);
      input.focus();
    }

    /**
     * Full-Screen Display Overlay
     */
    function enterFullScreen() {
      const content = state.text.trim();
      if (!content) {
        showToast('請先輸入文字或選擇常用語句喔！');
        focusTextInput();
        return;
      }

      const overlay = document.getElementById('fullScreenOverlay');
      const fsText = document.getElementById('fullScreenText');

      // Boost font size slightly in full-screen for maximum readability
      const boostedSize = Math.min(136, Math.round(state.fontSize * 1.15));
      fsText.style.fontSize = `${boostedSize}px`;
      fsText.textContent = content;

      overlay.classList.remove('hidden');
      triggerHaptic(20);

      // Attempt native fullscreen on mobile Chrome if supported (graceful fallback to fixed overlay)
      if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    function exitFullScreen() {
      const overlay = document.getElementById('fullScreenOverlay');
      overlay.classList.add('hidden');
      triggerHaptic(15);

      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }

    /* ==========================================================================
       VOICE-TO-TEXT (Web Speech API - zh-TW)
       ========================================================================== */

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.continuous = false;
      recognition.interimResults = true;

      let baseTextBeforeSpeech = '';

      recognition.onstart = () => {
        state.isListening = true;
        baseTextBeforeSpeech = state.text ? state.text + (state.text.endsWith('\n') ? '' : ' ') : '';
        updateVoiceButtonUI(true);
        showToast('請開始說話（國語）...', 2000);
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript;
          } else {
            interimTranscript += transcript;
          }
        }

        const combined = baseTextBeforeSpeech + (finalTranscript || interimTranscript);
        const input = document.getElementById('messageInput');
        input.value = combined;
        handleTextInput(combined);
      };

      recognition.onerror = (event) => {
        state.isListening = false;
        updateVoiceButtonUI(false);

        if (event.error === 'no-speech') {
          showToast('沒有偵測到聲音，請再試一次。');
        } else if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          showToast('瀏覽器未開啟麥克風權限，建議直接點輸入框並按手機鍵盤上的 🎤 語音輸入！', 4200);
        } else {
          showToast('語音辨識暫時無法使用，您也可以用手機鍵盤上的 🎤 麥克風輸入喔！', 4000);
        }
      };

      recognition.onend = () => {
        state.isListening = false;
        updateVoiceButtonUI(false);
      };

      state.recognition = recognition;
    }

    function toggleVoiceInput() {
      triggerHaptic(20);

      if (!state.recognition) {
        showToast('此瀏覽器不支援網頁語音，請點輸入框並使用手機鍵盤上的 🎤 麥克風！', 4200);
        focusTextInput();
        return;
      }

      if (state.isListening) {
        try {
          state.recognition.stop();
        } catch (e) {}
      } else {
        try {
          state.recognition.start();
        } catch (e) {
          showToast('請稍候再試，或使用手機鍵盤上的 🎤 麥克風輸入。', 3500);
        }
      }
    }

    function updateVoiceButtonUI(listening) {
      const btn = document.getElementById('voiceBtn');
      const label = document.getElementById('voiceBtnText');

      if (listening) {
        btn.classList.remove('ui-elevated');
        btn.classList.add('bg-red-600', 'text-white', 'border-red-400', 'recording-pulse');
        label.textContent = '正在聆聽...';
      } else {
        btn.classList.remove('bg-red-600', 'text-white', 'border-red-400', 'recording-pulse');
        btn.classList.add('ui-elevated');
        label.textContent = '語音輸入';
      }
    }

    /* ==========================================================================
       HANDWRITING CANVAS MODE (Smooth Touch Drawing + High-DPI + Vector Undo)
       ========================================================================== */

    let canvas, ctx;

    function initCanvas() {
      canvas = document.getElementById('drawingCanvas');
      ctx = canvas.getContext('2d');

      // Pointer / Touch / Mouse events
      canvas.addEventListener('pointerdown', startDrawing);
      canvas.addEventListener('pointermove', drawMove);
      canvas.addEventListener('pointerup', endDrawing);
      canvas.addEventListener('pointercancel', endDrawing);
      canvas.addEventListener('pointerout', endDrawing);

      // Handle orientation change and mobile Chrome viewport resize
      window.addEventListener('resize', () => {
        if (state.mode === 'draw') {
          resizeCanvas();
        }
      });
    }

    function resizeCanvas() {
      const wrapper = document.getElementById('canvasWrapper');
      if (!wrapper || !canvas) return;

      const rect = wrapper.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);

      redrawCanvas();
    }

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function getThemeColors() {
      if (state.theme === 'black-white') {
        return { bg: '#000000', ink: '#FFFFFF' };
      }
      if (state.theme === 'white-black') {
        return { bg: '#FFFFFF', ink: '#000000' };
      }
      // Default: black-yellow
      return { bg: '#000000', ink: '#FFEB3B' };
    }

    function startDrawing(e) {
      if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
      canvas.setPointerCapture(e.pointerId);

      state.isDrawing = true;
      const point = getCanvasCoords(e);
      state.currentStroke = {
        size: state.brushSize,
        points: [point]
      };
      state.strokes.push(state.currentStroke);

      document.getElementById('canvasHint').classList.add('hidden');
      redrawCanvas();
    }

    function drawMove(e) {
      if (!state.isDrawing || !state.currentStroke) return;
      const point = getCanvasCoords(e);
      state.currentStroke.points.push(point);
      redrawCanvas();
    }

    function endDrawing(e) {
      if (!state.isDrawing) return;
      state.isDrawing = false;
      state.currentStroke = null;
      try {
        if (e.pointerId !== undefined) {
          canvas.releasePointerCapture(e.pointerId);
        }
      } catch (err) {}
    }

    /**
     * Re-renders all vector strokes onto the canvas with smooth quadratic curves
     */
    function redrawCanvas() {
      if (!canvas || !ctx) return;

      const wrapper = document.getElementById('canvasWrapper');
      const rect = wrapper.getBoundingClientRect();
      const { bg, ink } = getThemeColors();

      // Fill solid high-contrast background
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, rect.width, rect.height);

      // Update hint visibility
      const hint = document.getElementById('canvasHint');
      if (hint) {
        hint.classList.toggle('hidden', state.strokes.length > 0);
      }

      // Draw every stroke smoothly
      ctx.strokeStyle = ink;
      ctx.fillStyle = ink;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (const stroke of state.strokes) {
        const pts = stroke.points;
        if (!pts || pts.length === 0) continue;

        ctx.lineWidth = stroke.size;

        if (pts.length === 1) {
          // Single tap dot
          ctx.beginPath();
          ctx.arc(pts[0].x, pts[0].y, stroke.size / 2, 0, Math.PI * 2);
          ctx.fill();
          continue;
        }

        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);

        for (let i = 1; i < pts.length - 1; i++) {
          const midX = (pts[i].x + pts[i + 1].x) / 2;
          const midY = (pts[i].y + pts[i + 1].y) / 2;
          ctx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
        }

        const last = pts[pts.length - 1];
        ctx.lineTo(last.x, last.y);
        ctx.stroke();
      }
    }

    function setBrushSize(size) {
      state.brushSize = size;
      triggerHaptic();

      const thickBtn = document.getElementById('brush-thick');
      const extraBtn = document.getElementById('brush-extra');

      if (size === 8) {
        thickBtn.classList.remove('ui-elevated');
        thickBtn.classList.add('ui-accent');
        extraBtn.classList.remove('ui-accent');
        extraBtn.classList.add('ui-elevated');
      } else {
        extraBtn.classList.remove('ui-elevated');
        extraBtn.classList.add('ui-accent');
        thickBtn.classList.remove('ui-accent');
        thickBtn.classList.add('ui-elevated');
      }
    }

    function undoStroke() {
      if (state.strokes.length === 0) {
        showToast('目前沒有筆畫可以復原');
        return;
      }
      state.strokes.pop();
      redrawCanvas();
      triggerHaptic();
    }

    function clearCanvas() {
      if (state.strokes.length === 0) return;
      state.strokes = [];
      redrawCanvas();
      triggerHaptic(25);
      showToast('已清除畫板');
    }

    /* ==========================================================================
       QUICK PHRASES LIBRARY (常用語句庫 + localStorage)
       ========================================================================== */

    function renderPhrases() {
      const container = document.getElementById('phraseListContainer');
      container.innerHTML = '';

      // Render custom phrases first so caregiver's own additions are right at the top
      state.customPhrases.forEach((phrase, index) => {
        const row = document.createElement('div');
        row.className = 'flex items-stretch gap-2';

        const selectBtn = document.createElement('button');
        selectBtn.type = 'button';
        selectBtn.className = 'flex-1 min-h-[58px] px-4 py-3 rounded-2xl ui-elevated border-2 text-left font-black text-lg sm:text-xl leading-snug active:scale-[0.99] transition-transform flex items-center justify-between gap-2';
        selectBtn.onclick = () => selectQuickPhrase(phrase);

        const textSpan = document.createElement('span');
        textSpan.textContent = phrase;

        const badge = document.createElement('span');
        badge.className = 'text-xs px-2 py-0.5 rounded-lg ui-accent font-extrabold shrink-0';
        badge.textContent = '自訂';

        selectBtn.appendChild(textSpan);
        selectBtn.appendChild(badge);

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'min-h-[58px] min-w-[56px] rounded-2xl bg-red-600/90 hover:bg-red-600 text-white font-bold flex items-center justify-center active:scale-95 transition-transform shrink-0';
        delBtn.setAttribute('aria-label', `刪除語句：${phrase}`);
        delBtn.innerHTML = `
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        `;
        delBtn.onclick = () => deleteCustomPhrase(index);

        row.appendChild(selectBtn);
        row.appendChild(delBtn);
        container.appendChild(row);
      });

      // Render built-in daily care preset phrases
      DEFAULT_PHRASES.forEach((phrase) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'w-full min-h-[58px] px-4 py-3.5 rounded-2xl ui-elevated border-2 text-left font-black text-lg sm:text-xl leading-snug active:scale-[0.99] transition-transform flex items-center justify-between gap-3';
        btn.onclick = () => selectQuickPhrase(phrase);

        const textSpan = document.createElement('span');
        textSpan.textContent = phrase;

        const arrowIcon = document.createElement('span');
        arrowIcon.className = 'opacity-70 shrink-0';
        arrowIcon.innerHTML = `
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
          </svg>
        `;

        btn.appendChild(textSpan);
        btn.appendChild(arrowIcon);
        container.appendChild(btn);
      });
    }

    function addCustomPhrase(event) {
      event.preventDefault();
      const input = document.getElementById('newPhraseInput');
      const value = input.value.trim();

      if (!value) {
        showToast('請先輸入要新增的語句內容');
        input.focus();
        return;
      }

      state.customPhrases.unshift(value);
      saveCustomPhrases();
      input.value = '';
      renderPhrases();
      triggerHaptic(20);
      showToast('已新增至常用語句庫');
    }

    function deleteCustomPhrase(index) {
      state.customPhrases.splice(index, 1);
      saveCustomPhrases();
      renderPhrases();
      triggerHaptic(20);
      showToast('已移除自訂語句');
    }

    function saveCustomPhrases() {
      try {
        localStorage.setItem(STORAGE_KEYS.CUSTOM_PHRASES, JSON.stringify(state.customPhrases));
      } catch (e) {}
    }

    /**
     * Clicking any phrase switches to Big Text Mode and displays it immediately
     */
    function selectQuickPhrase(phrase) {
      const input = document.getElementById('messageInput');
      input.value = phrase;
      handleTextInput(phrase);
      switchMode('text');
      showToast('已切換為大字顯示，可點「全螢幕展示」放大');
    }
  </script>
</body>
</html>
